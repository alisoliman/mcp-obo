apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: orders
resources:
- serviceaccount.yaml
- deployment.yaml
- service.yaml
configMapGenerator:
- envs:
  - .env
  name: mcp-config
replacements:
- source:
    fieldPath: data.ENTRA_SERVER_CLIENT_ID
    kind: ConfigMap
    name: mcp-config
  targets:
  - fieldPaths:
    - metadata.annotations.[azure.workload.identity/client-id]
    select:
      kind: ServiceAccount
      name: fastmcp-orders
- source:
    fieldPath: data.AZURE_TENANT_ID
    kind: ConfigMap
    name: mcp-config
  targets:
  - fieldPaths:
    - metadata.annotations.[azure.workload.identity/tenant-id]
    select:
      kind: ServiceAccount
      name: fastmcp-orders
