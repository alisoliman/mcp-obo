apiVersion: v1
kind: ServiceAccount
metadata:
  # This name and the kustomization's namespace form the federated identity
  # subject in infra/main.bicep (serverFederationSubject). Change one without the
  # other and Entra still accepts the credential; the OBO exchange is what fails,
  # as a masked tool error.
  name: fastmcp-orders
  annotations:
    azure.workload.identity/client-id: replace-me
    azure.workload.identity/tenant-id: replace-me
