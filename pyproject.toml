[project]
name = "fastmcp-order-aks"
version = "0.1.0"
description = "Delegated identity for MCP servers on Azure: every tool call runs as the person who asked."
requires-python = ">=3.13"
dependencies = [
    "agent-framework-foundry>=1.10.1",
    "fastmcp[azure]==3.4.7",
    "msal>=1.37.0",
    "starlette>=1.3.1",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.14",
]

[tool.ruff]
target-version = "py313"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Line length is left to the formatter. The prose comments in this repo are
# wrapped by hand to sit under it, and a lint error on the odd long URL or
# error string is noise rather than a finding.
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastMCP resolves the caller's token through an argument default, the way
# FastAPI resolves a dependency. It is the framework's idiom, not a mutable
# default being shared between calls.
extend-immutable-calls = ["fastmcp.server.dependencies.CurrentAccessToken"]

[tool.pytest.ini_options]
addopts = "-ra"
# `tests/e2e_databricks.py` does not match `test_*.py`, so it is never collected
# by a bare `pytest` even though it lives under `testpaths`. That is deliberate:
# it calls a deployed stack, and the fast local loop must not quietly become
# live round trips once someone has run `azd up`. Run it by naming it.
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
# mypy is deliberately not in the `dev` group. It is a tool rather than a
# library -- nothing here imports it -- and keeping it out of the dependency
# graph stops it constraining resolution of the packages this code actually
# ships with. Run it the way CI does:
#
#     uvx mypy==2.3.0 --python-executable .venv/bin/python
#
# `--python-executable` is what lets an isolated mypy read the project's
# installed packages, so pydantic and httpx types are checked rather than
# waved through by `ignore_missing_imports`.
#
# `tests` is deliberately absent from `files`. Test code is full of fakes that
# stand in for a library type without implementing it, and helpers that reach
# for an attribute a base class does not declare. Checking it produces noise
# about the mocks rather than findings about the code under test.
files = ["src", "scripts"]
# `fastmcp`, `agent_framework` and `msal` ship partial or absent type
# information. Checking this repo's own code against them is still worth doing;
# demanding that they be fully typed first is not.
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
